nd="url(#esah)"/><text x="531.0" y="216.0" font-size="10.5" fill="#185FA5" text-anchor="end" font-weight="normal">same invoice (0 wk); a ~9-wk channel cover keeps sell-out going</text><path d="M541.0 324.0L462.2 356.0" stroke="#185FA5" stroke-width="1.6" fill="none" marker-end="url(#esah)"/><text x="551.0" y="344.0" font-size="10.5" fill="#185FA5" text-anchor="start" font-weight="normal">build -&gt; sale 7.7 wk (ODM E08, in-house E05)</text><path d="M462.2 452.0L444.9 484.0" stroke="#185FA5" stroke-width="1.6" fill="none" marker-end="url(#esah)"/><text x="472.2" y="472.0" font-size="10.5" fill="#185FA5" text-anchor="start" font-weight="normal">Nordic ship -&gt; build 6.7 wk (E01-E03); lead 14.3 wk in all</text><line x1="340.2" y1="66" x2="340.2" y2="590" stroke="#222" stroke-dasharray="5 3"/><text x="343.2" y="76.0" font-size="9.5" fill="#222" text-anchor="start" font-weight="normal">incident 25 Jun</text><line x1="402.0" y1="480.0" x2="402.0" y2="590" stroke="#666" stroke-dasharray="2 3"/><text x="399.0" y="584.0" font-size="9.5" fill="#666" text-anchor="end" font-weight="normal">Nordic guides 06 Aug</text><line x1="617.0" y1="224.0" x2="617.0" y2="316.0" stroke="#3B8C5A" stroke-dasharray="5 3"/><text x="620.0" y="220.0" font-size="9.5" fill="#3B8C5A" text-anchor="start" font-weight="normal">Logitech sales back to normal</text><line x1="469.6" y1="480.0" x2="469.6" y2="590" stroke="#3B8C5A" stroke-dasharray="2 3"/><text x="472.6" y="584.0" font-size="9.5" fill="#3B8C5A" text-anchor="start" font-weight="normal">chips for those sales ship</text><rect x="215" y="598" width="10" height="10" fill="#B5534B"/><text x="229.0" y="607.0" font-size="10" fill="#222" text-anchor="start" font-weight="normal">orders pushed out / cancelled</text><rect x="365" y="598" width="10" height="10" fill="#BA7517"/><text x="379.0" y="607.0" font-size="10" fill="#222" text-anchor="start" font-weight="normal">stock at the holder used first</text><rect x="515" y="598" width="10" height="10" fi